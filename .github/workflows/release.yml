name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify packaged executable
        run: python scripts/smoke_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeStudio-Windows
          path: |
            dist/ExchangeStudio-Windows.zip
            dist/SHA256SUMS.txt
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure sdkmanager path
        run: echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Gradle 8.7
        run: |
          curl -L -o "$RUNNER_TEMP/gradle-8.7-bin.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP"
      - name: Restore Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_STORE_PASSWORD != '' }}
        run: |
          mkdir -p .android-signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/exchange-release.jks
          printf '%s' "$ANDROID_STORE_PASSWORD" > .android-signing/password.txt
      - name: Build Android APK
        run: |
          python scripts/build_android.py \
            --java-home "$JAVA_HOME" \
            --sdk "$ANDROID_HOME" \
            --gradle "$RUNNER_TEMP/gradle-8.7/bin/gradle" \
            --version-code "${{ github.run_number }}" \
            --version-name "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeStudio-Android
          path: |
            dist/ExchangeStudio-Android.apk
            dist/ANDROID-SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ExchangeStudio-Windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ExchangeStudio-Android
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "Exchange Studio $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md --generate-notes
