name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify packaged executable
        run: python scripts/smoke_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeStudio-Windows
          path: |
            dist/ExchangeStudio-Windows.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExchangeStudio-Windows
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "Exchange Studio $RELEASE_TAG" --generate-notes
